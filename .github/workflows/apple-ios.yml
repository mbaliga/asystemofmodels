# Apple / Swift lane, halves I0a and I0b (PLATFORM_PLAN.md section 6, step I0 = MC0 = L0.7). Ships nothing.
#
# EVIDENCE LABELS: every artefact and every result of this workflow is UNSIGNED, LAB / CI (hosted VM) evidence.
# It is NOT device evidence. Nothing here is a speed, thermal or memory figure.
# This file was written in a container that has neither Xcode nor a Docker daemon and could not run GitHub Actions:
# it is syntax-checked (actionlint), and every job below is UNVERIFIED until a hosted run has been seen.
#
# The lane diff compares two implementations of one spec, written in one repository. The vectors stay `oracle: self`;
# agreement is cross-lane evidence, not independent evidence (apple/ERRATA.md E-02 and E-17, LAB_SPEC.md 4.10).

name: apple-ios

on:
  push:
    paths:
      - "apple/**"
      - "lab/**"
      - ".github/workflows/apple-ios.yml"
  pull_request:
    paths:
      - "apple/**"
      - "lab/**"
      - ".github/workflows/apple-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PLATFORM_PLAN P2 with the R3-CONFORMANCE-2 correction. The first version diffed against the PR base branch, which
  # for the v1 review PR includes every v1 change and therefore failed by construction (hosted run 2026-09-30). This
  # reuses the lab's pinned-base check (lab/tools/isolation.py: byte-for-byte against lab/LAB_BASE_SHA).
  root-unchanged:
    name: root build and shipped modules unchanged (pinned base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Compare the protected paths with the pinned base
        run: python3 lab/tools/isolation.py

  apple-swift-lane:
    name: apple-swift-lane (${{ matrix.name }})
    needs: root-unchanged
    runs-on: ${{ matrix.os }}
    # macOS runs the system CryptoKit; the Linux container runs swift-crypto (Package.swift: .when(platforms: [.linux])).
    # The image is pinned by digest (resolved from Docker Hub on 2026-09-30, not pulled or run when this was written).
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-latest, CryptoKit
            os: macos-latest
            container: ""
            lines: swift-lines-macos
          - name: ubuntu-latest, swift:6.1-noble, swift-crypto
            os: ubuntu-latest
            container: swift:6.1-noble@sha256:3991e5dd5c40b04580c1e56f1ad6042f3173829b1995ffa53b84957371c25876
            lines: swift-lines-linux
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Toolchain
        run: swift --version
      - name: Build and test
        run: swift test --package-path apple
      - name: Build the conformance CLI
        run: swift build --package-path apple --product asom-conformance
      # Half I0a: the r0 vectors of the design session (confVersion 0.1.0), DSSE layer only. Kept as a regression check.
      - name: r0 DSSE-layer consistency check
        env:
          ASOM_CONFORMANCE_DIR: docs/design/mesh/manifest-vectors
        run: swift run --skip-build --package-path apple asom-conformance check M02,M03
      # Half I0b: the lab's r3 vectors (confVersion 0.2.0). `lines` is this lane's own verdict per vector, in the format
      # of the JVM runner's lines mode; lane-diff compares it with the JVM lane's, one vector at a time.
      - name: r3 lines (spec-literal reading; the gate input)
        env:
          ASOM_CONFORMANCE_DIR: lab/conformance
        run: |
          mkdir -p out
          swift run --skip-build --package-path apple asom-conformance lines M01,M02,M03,M04,M05,M06 > out/swift.lines
          wc -l out/swift.lines
      # Diagnostic only, never the gate: with the row flag `thermal-drift` emitted (finding F-1 in apple/ERRATA.md) the
      # Swift lane reproduces every vector it implements. This shows what remains once that one ambiguity is set aside.
      - name: r3 lines (diagnostic, thermal-drift flag emitted)
        env:
          ASOM_CONFORMANCE_DIR: lab/conformance
          ASOM_DIAGNOSTIC_DRIFT_FLAG: "1"
        run: swift run --skip-build --package-path apple asom-conformance lines M01,M02,M03,M04,M05,M06 > out/swift-diagnostic.lines
      - name: r3 self-check of the diagnostic reading against the vectors' own expectations (must be 0 mismatches)
        env:
          ASOM_CONFORMANCE_DIR: lab/conformance
          ASOM_DIAGNOSTIC_DRIFT_FLAG: "1"
        run: swift run --skip-build --package-path apple asom-conformance check M01,M02,M03,M04,M05,M06
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNSIGNED-${{ matrix.lines }}
          path: out/

  ios-package-sim:
    name: ios-package-sim (iPhone 17 simulator, package targets only)
    needs: root-unchanged
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Xcode and simulators available on this runner
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -40
      # SwiftPM generates the AsomKit-Package scheme from the package's library products (apple/Package.swift).
      # Whether macos-latest carries an iPhone 17 runtime is unverified; a missing device fails here, loudly.
      - name: Test the package in the simulator
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild -scheme AsomKit-Package -destination 'platform=iOS Simulator,name=iPhone 17' test 2>&1 | tee ../xcodebuild.log
          grep -F '** TEST SUCCEEDED **' ../xcodebuild.log

  # PLATFORM_PLAN section 6: the JVM verdicts, from the lab's conformance runner in lines mode (LAB_SPEC.md 3.3).
  jvm-lines:
    name: jvm-lines (JDK 17, lab conformance runner)
    needs: root-unchanged
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Lines mode
        run: |
          mkdir -p out
          ./gradlew -p lab :conformance-runner:run --args='lines M01,M02,M03,M04,M05,M06' --quiet > out/jvm.lines
          wc -l out/jvm.lines
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNSIGNED-jvm-lines
          path: out/jvm.lines

  # The diff is per vector (apple/ci/lane_diff.py), not a whole-file diff. It fails on:
  #   - a disagreement that is not in apple/ci/known-disagreements.txt (an unexplained one),
  #   - an entry of that list that now agrees (a stale list hides regressions),
  #   - a vector the JVM lane prints and the Swift lane does not, unless it is in apple/ci/not-implemented.txt
  #     (the M04 run-plan, governor and executor kinds, which half I0b does not cover),
  #   - a vector only the Swift lane prints.
  # Known disagreements (both lists are explicit files, not a continue-on-error): 37 vectors, all finding F-1 of
  # apple/ERRATA.md. The JVM lane emits the row flag `thermal-drift`; benchmark.md 13.3 lists no such flag, so the Swift
  # lane's step 15a says DERIVATION_MISMATCH before it reaches the step that decides the vector.
  lane-diff:
    name: lane-diff (per vector, JVM against Swift on macOS and on Linux)
    needs: [jvm-lines, apple-swift-lane]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: UNSIGNED-*
          path: lanes
      - name: Layout of the downloaded artefacts
        run: find lanes -type f | sort
      - name: Per vector, spec-literal reading (known disagreements listed in apple/ci/known-disagreements.txt)
        run: |
          rc=0
          for lane in swift-lines-macos swift-lines-linux; do
            echo "== JVM against $lane"
            python3 apple/ci/lane_diff.py lanes/UNSIGNED-jvm-lines/jvm.lines "lanes/UNSIGNED-$lane/swift.lines" \
              --known apple/ci/known-disagreements.txt --not-implemented apple/ci/not-implemented.txt || rc=1
          done
          exit $rc
      - name: Per vector, diagnostic reading with F-1 set aside (no disagreement allowed)
        run: |
          rc=0
          for lane in swift-lines-macos swift-lines-linux; do
            echo "== JVM against $lane (diagnostic)"
            python3 apple/ci/lane_diff.py lanes/UNSIGNED-jvm-lines/jvm.lines "lanes/UNSIGNED-$lane/swift-diagnostic.lines" \
              --not-implemented apple/ci/not-implemented.txt || rc=1
          done
          exit $rc
      - name: The two Swift builds agree with each other, byte for byte
        run: |
          diff lanes/UNSIGNED-swift-lines-macos/swift.lines lanes/UNSIGNED-swift-lines-linux/swift.lines
          diff lanes/UNSIGNED-swift-lines-macos/swift-diagnostic.lines lanes/UNSIGNED-swift-lines-linux/swift-diagnostic.lines
