name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: JVM tests (bare JDK — pure-JVM-first law)
    runs-on: ubuntu-latest
    env:
      # Hide the runner's Android SDK so this job proves the brief §3 law:
      # :core:* and :server build and test with NO Android SDK present.
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run pure-JVM tests
        run: ./gradlew jvmTest --stacktrace

  android-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android-module unit tests
        run: ./gradlew :vault:testDebugUnitTest :ledger:testDebugUnitTest :client:testDebugUnitTest --stacktrace

      - name: Assemble debug APKs
        run: ./gradlew :app:assembleDebug :sample-client:assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: asom-debug-apk
          path: app/build/outputs/apk/debug/*.apk
