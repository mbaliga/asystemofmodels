name: desktop-windows

# The Windows track (PLATFORM_PLAN section 4, steps W0, W1 and W2 ONLY). A NEW workflow: .github/workflows/ci.yml is untouched.
# W3 to W7 (JNI builds, app image, MSI, service smoke, two-node smoke, winget) are NOT here: they are D-v2 work and their jobs
# do not exist yet (desktop/packaging/windows/scripts/*.ps1 are NOT-YET-IMPLEMENTED stubs).
#
# EVIDENCE LABELS: everything this workflow produces is "CI (hosted VM) evidence" and is NOT device evidence. Every artefact is
# UNSIGNED and not a release. TPM, GPU, sleep, lid, Modern Standby, SmartScreen, real firewall profiles and Tailscale stay
# NEEDS-DEVICE-VALIDATION.
#
# STATUS OF THIS FILE: written in a container that has no Windows and could not run GitHub Actions. It is syntax-checked with
# actionlint and its scripts were run on Linux; every job marked WINDOWS below is UNVERIFIED until a hosted run has been seen.
#
# Third-party actions are pinned by commit SHA; the tag each SHA was resolved from is in the comment (resolved with
# `git ls-remote` on 2026-09-30). The same SHAs as desktop-linux.yml, plus actions/download-artifact.
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "lab/**"
      - "core/**"
      - "server/**"
      - "gradle/**"
      - "docs/design/mesh/conformance-examples/**"
      - "docs/design/mesh/manifest-vectors/**"
      - ".gitattributes"
      - ".github/workflows/desktop-windows.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "lab/**"
      - "core/**"
      - "server/**"
      - "gradle/**"
      - "docs/design/mesh/conformance-examples/**"
      - "docs/design/mesh/manifest-vectors/**"
      - ".gitattributes"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

# Pure-JVM jobs never see an Android SDK (PLATFORM_PLAN P4).
env:
  ANDROID_HOME: ""
  ANDROID_SDK_ROOT: ""

jobs:
  # PLATFORM_PLAN P2 with the R3-CONFORMANCE-2 correction: byte-for-byte against the pinned base, not `git diff` on a fresh checkout.
  root-unchanged:
    name: root build and shipped modules unchanged (pinned base)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Negative controls of the isolation check, then the check itself
        run: |
          python3 desktop/tools/isolation.py --selftest
          python3 desktop/tools/isolation.py

  # The reference the Windows lab lanes are compared with: the same labTest on Linux, and its per-module test counts.
  lab-linux-reference:
    name: Lab reference counts (Linux, JDK 17)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew -p lab labTest --stacktrace
      - name: The eol rule holds where the files are authored too
        run: python3 desktop/packaging/windows/scripts/check_eol.py
      - name: Per-module counts
        run: python3 desktop/packaging/windows/scripts/lab_counts.py lab --out lab-counts-linux.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lab-counts-linux
          path: lab-counts-linux.txt
          retention-days: 3

  # W0 (lab-only, ships nothing). WINDOWS: UNVERIFIED until a hosted run has been seen.
  lab-windows:
    name: W0 lab on Windows (JDK ${{ matrix.jdk }})
    needs: lab-linux-reference
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        jdk: ["17", "21"]
    steps:
      # No fetch-depth 0: nothing here needs history. The eol check reads the index and the working tree.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Positive control for the charset trap (AW20, C17). JDK 17 on Windows must default to a legacy code page and JDK 21 to
      # UTF-8 (JEP 400); if this runner's JDK 17 already defaults to UTF-8 (the "Beta: use Unicode UTF-8" locale switch), this
      # lane cannot catch a default-charset regression and says so by failing.
      - name: Positive control - the default charset of this JDK
        shell: pwsh
        run: |
          $props = (& java -XshowSettings:properties -version 2>&1 | Out-String)
          $props -split "`r?`n" | Where-Object { $_ -match '(file|native|sun\.jnu)\.encoding' } | ForEach-Object { $_.Trim() }
          $utf8 = $props -match 'file\.encoding = UTF-8'
          if ('${{ matrix.jdk }}' -eq '17' -and $utf8) { throw 'JDK 17 defaults to UTF-8 on this runner: the lane cannot catch AW20' }
          if ('${{ matrix.jdk }}' -eq '21' -and -not $utf8) { throw 'JDK 21 should default to UTF-8 (JEP 400)' }

      - name: Every byte-exact vector file carries -text and no CRLF
        run: python desktop/packaging/windows/scripts/check_eol.py

      # The command of the spec. NOTE: lab/gradle.properties sets -Dfile.encoding=UTF-8 in org.gradle.jvmargs, so the Gradle
      # daemon, and through it the test workers, run UTF-8 whatever the JDK defaults to. This step alone therefore does NOT
      # exercise the JDK 17 charset trap; the next step does (windows ERRATA WIN-LANE-1).
      - name: labTest as the spec writes it
        run: ./gradlew.bat -p lab labTest --stacktrace

      - name: Test counts of this lane (as written)
        run: python desktop/packaging/windows/scripts/lab_counts.py lab --out lab-counts-windows-as-written.txt

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lab-counts-linux

      - name: Compare with the Linux reference (as written)
        run: python desktop/packaging/windows/scripts/lab_counts.py --compare lab-counts-linux.txt lab-counts-windows-as-written.txt

      # The lane that can catch AW20: the JVM-args override drops -Dfile.encoding, so the daemon and the test workers inherit the
      # platform default (Cp1252 on JDK 17). --no-build-cache and --rerun-tasks: a cached test result would prove nothing.
      # Container evidence for this override (JDK 21, windows-1252 forced): windows ERRATA WIN-LANE-1 and PROGRESS.md.
      - name: labTest with the platform default charset
        run: ./gradlew.bat -p lab labTest --no-build-cache --rerun-tasks "-Dorg.gradle.jvmargs=-Xmx3g" --stacktrace

      - name: Test counts of this lane (platform default charset)
        run: python desktop/packaging/windows/scripts/lab_counts.py lab --out lab-counts-windows-default-charset.txt

      - name: Compare with the Linux reference (platform default charset)
        run: python desktop/packaging/windows/scripts/lab_counts.py --compare lab-counts-linux.txt lab-counts-windows-default-charset.txt

  # W1 and W2 on Linux (LAB): the pure tests run, the Windows-only integration tests are SKIPPED and must be seen skipped.
  winplatform-linux:
    name: winplatform pure tests on Linux (JDK ${{ matrix.jdk }}; ITs must be SKIPPED)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        jdk: ["17", "21"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: winplatform tests (prints the summary with the skipped count)
        run: ./gradlew -p desktop :packaging:windows:winplatform:test --stacktrace
      - name: The integration tests were SKIPPED, none passed
        run: python3 desktop/packaging/windows/scripts/check_it_results.py --expect skipped desktop/packaging/windows/winplatform/build/test-results/test
      - name: Desktop static law checks (no listener, no print, no wildcard, no Android)
        run: python3 desktop/tools/check_law.py

  # W1 and W2 on Windows. WINDOWS: UNVERIFIED until a hosted run has been seen. The integration tests use real DPAPI, the
  # Software KSP, power requests, PDH, AF_UNIX plus the DACL, a named mutex, netsh and WTS.
  winplatform:
    name: W1 W2 winplatform on ${{ matrix.os }} (JDK ${{ matrix.jdk }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            jdk: "17"
          - os: windows-2025
            jdk: "21"
          - os: windows-11-arm
            jdk: "21"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: winplatform tests, the integration tests run for real
        run: ./gradlew.bat -p desktop :packaging:windows:winplatform:test --stacktrace
      # Python comes AFTER the tests on purpose: whether setup-python has Python for windows-11-arm is UNVERIFIED, and a setup
      # failure there must not stop the tests from running.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: always()
        with:
          python-version: "3.12"
      - name: The integration tests RAN and passed (PcpIT may skip, no TPM on a hosted VM, AW11)
        if: always()
        run: python desktop/packaging/windows/scripts/check_it_results.py --expect windows desktop/packaging/windows/winplatform/build/test-results/test
      - name: Evidence lines the tests printed
        if: always()
        shell: pwsh
        run: |
          $f = 'desktop/packaging/windows/winplatform/build/reports/desktop/report.txt'
          if (Test-Path $f) { Get-Content $f } else { 'no report file' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: winplatform-test-results-${{ matrix.os }}-jdk${{ matrix.jdk }}-UNSIGNED-not-for-release
          path: |
            desktop/packaging/windows/winplatform/build/test-results/test/*.xml
            desktop/packaging/windows/winplatform/build/reports/desktop/report.txt
          retention-days: 3
